<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fullscreen Flip Demo</title>
<style>
  body {
    margin: 0; padding: 0;
    background: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .fullscreen {
    position: fixed;
    inset: 0;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    cursor: pointer;
  }

  .fullscreen-flip-host {
    display: flex;
    align-items: center;
    justify-content: center;
    max-width: 90vw;
    max-height: 90vh;
    width: 100%;
    height: 100%;
    perspective: 1200px;
  }

  .fullscreen-flip-wrapper {
    position: relative;
    width: 85vw;
    height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
  }

  .fullscreen-face {
    position: absolute;
    max-width: 85vw;
    max-height: 85vh;
    object-fit: contain;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    filter: drop-shadow(4px 6px 8px rgba(0, 0, 0, 0.4));
  }

  .fullscreen-front {
    z-index: 2;
  }

  .fullscreen-back {
    transform: rotateY(180deg);
  }
</style>
</head>
<body>

<button id="openBtn">Abrir Fullscreen Flip</button>

<script>
  function openFullscreenWithFlip(frontSrc, backSrc, nextStep) {
    const fullscreen = document.createElement('section');
    fullscreen.className = 'fullscreen';

    const flipHost = document.createElement('section');
    flipHost.className = 'fullscreen-flip-host';

    const flipWrapper = document.createElement('section');
    flipWrapper.className = 'fullscreen-flip-wrapper';

    const frontFace = document.createElement('img');
    frontFace.src = frontSrc;
    frontFace.className = 'fullscreen-face fullscreen-front';

    const backFace = document.createElement('img');
    backFace.src = backSrc;
    backFace.className = 'fullscreen-face fullscreen-back';

    flipWrapper.appendChild(frontFace);
    flipWrapper.appendChild(backFace);
    flipHost.appendChild(flipWrapper);
    fullscreen.appendChild(flipHost);

    // Clique na imagem faz flip
    flipWrapper.addEventListener('click', e => {
      e.stopPropagation();
      const flipped = flipWrapper.style.transform === 'rotateY(180deg)';
      flipWrapper.style.transform = flipped ? 'rotateY(0deg)' : 'rotateY(180deg)';
    });

    // Clicar no fundo fecha
    fullscreen.addEventListener('click', e => {
      if (e.target === fullscreen) {
        fullscreen.remove();
        if (nextStep) {
          // loadStep(nextStep);
          console.log('nextStep:', nextStep);
        }
      }
    });

    document.body.appendChild(fullscreen);
  }

  // Só para testar
  document.getElementById('openBtn').addEventListener('click', () => {
    openFullscreenWithFlip(
      '/imgs/secao1/objeto-1-frente.png"', 
      '/imgs/secao1/objeto-1-costas.png',
      'step2'
    );
  });
</script>

</body>
</html>
