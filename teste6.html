<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>luca project</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    #stage {
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      scroll-behavior: smooth;
    }
    .image-wrap {
      position: relative;
      display: inline-block;
      height: 100vh;
    }
    #stageImg {
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .hotspot-object {
      position: absolute;
      cursor: pointer;
      pointer-events: auto;
      z-index: 2;
      filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.65));
      height: auto;
    }
    .fullscreen {
      position: fixed;
      top:0;
      left:0;
      width:100vw;
      height:100vh;
      background: rgba(255,255,255,0.95);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:9999;
    }
    .fullscreen img {
      max-width:90vw;
      max-height:90vh;
      filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.4));
      animation: zoomIn 0.4s ease;
    }
    @keyframes zoomIn {
      from {transform:scale(0.5);opacity:0;}
      to {transform:scale(1);opacity:1;}
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="image-wrap">
      <img id="stageImg" src="" draggable="false">
      <div id="overlay" class="overlay"></div>
    </div>
  </div>

  <script>
    const steps = [
      { src: "/imgs/Eenvelope_Aaberto.png", objects: [], next: 1 },
      { src: "/imgs/1_copiar.jpg", objects: [{ src: "/imgs/objeto_1_frente.png", left:28, top:20, width:28, nextStep:2 }] },
      { src: "/imgs/2_copiar.jpg", objects: [ { src: "/imgs/objeto_1_frente.png", left:2, top:9, width:21, zindex:2 }, { src: "/imgs/objeto2.png", left:10, top:12, width:30, zindex:1, nextStep:3 } ] },
      { src: "/imgs/3_copiar.jpg", objects: [ { src: "/imgs/objeto_1_frente.png", left:2, top:8, width:15, zindex:2 }, { src: "/imgs/objeto2.png", left:10, top:12, width:22, zindex:1, nextStep:3 }, { src:"/imgs/2_capa.png", left:30, top:5, width:20, zindex:0, nextStep:4 } ] },
      { src: "/imgs/4_copiar.jpg", objects: [] },
      { src: "/imgs/5_copiar.jpg", objects: [] },
      { src: "/imgs/6_copiar.jpg", objects: [] },
      { src: "/imgs/7_copiar.jpg", objects: [] },
      { src: "/imgs/8_copiar.jpg", objects: [] },
      { src: "/imgs/9_copiar.jpg", objects: [] },
      { src: "/imgs/10_copiar.jpg", objects: [] },
      { src: "/imgs/11_copiar.jpg", objects: [] },
    ];

    let currentStep = 0;
    const img = document.getElementById('stageImg');
    const overlay = document.getElementById('overlay');
    const wrap = document.querySelector('.image-wrap');

    function preload(src){
      if(src){
        const p = new Image();
        p.src = src;
      }
    }

    function clearOverlay(){
      overlay.innerHTML = '';
    }

    function createObjects(objects){
      clearOverlay();
      objects.forEach(o=>{
        const obj = document.createElement('img');
        obj.src = o.src;
        obj.className = 'hotspot-object';
        obj.style.left = o.left + '%';
        obj.style.top = o.top + '%';
        if(o.width!==undefined) obj.style.width = o.width + '%';
        if(o.height!==undefined) obj.style.height = o.height + '%';
        else obj.style.height = 'auto';
        obj.style.zIndex = o.zindex!==undefined ? o.zindex : 2;
        obj.addEventListener('click', e=>{
          e.stopPropagation();
          if(o.nextStep!==undefined) zoom(o.src, o.nextStep);
          else zoom(o.src);
        });
        overlay.appendChild(obj);
      });
    }

    function loadStep(i){
      if(i<0 || i>=steps.length) return;
      currentStep = i;
      const step = steps[i];
      clearOverlay();
      img.src = step.src;
      preload(steps[i+1]?.src);

      img.onload = ()=>{
        if(i === 0){
          // Envelope centralizado proporcional
          wrap.style.width = "100vw";
          wrap.style.height = "100vh";
          img.style.width = "100vw";
          img.style.height = "100vh";
          img.style.objectFit = "contain";
        } else if(i === 1){
          // Step 1 ocupa 100% da viewport sem barras
          wrap.style.width = "100vw";
          wrap.style.height = "100vh";
          img.style.width = "100vw";
          img.style.height = "100vh";
          img.style.objectFit = "cover";
        } else {
          // Demais steps proporcionais à altura
          wrap.style.width = img.naturalWidth * (wrap.clientHeight / img.naturalHeight) + 'px';
          wrap.style.height = "100vh";
          img.style.height = "100vh";
          img.style.width = "auto";
          img.style.objectFit = "initial";
        }

        createObjects(step.objects || []);

        if(i===0) img.onclick = ()=> loadStep(step.next);
        else img.onclick = null;

        const stage = document.getElementById('stage');
        stage.scrollLeft = (wrap.scrollWidth - stage.clientWidth) / 2;
      };
    }

    // Zoom funcional
    function zoom(src, nextStep){
      const fullscreen = document.createElement('div');
      fullscreen.className = 'fullscreen';
      const zimg = document.createElement('img');
      zimg.src = src;
      fullscreen.appendChild(zimg);
      fullscreen.addEventListener('click', e=>{
        if(e.target===fullscreen){
          fullscreen.remove();
          if(nextStep!==undefined) loadStep(nextStep);
        }
      });
      document.body.appendChild(fullscreen);
      document.addEventListener('keydown', function escHandler(e){
        if(e.key==='Escape'){
          fullscreen.remove();
          document.removeEventListener('keydown', escHandler);
        }
      });
    }

    // Navegação com setas
    document.addEventListener('keydown', e=>{
      if(e.key==='ArrowRight') loadStep(currentStep+1);
      if(e.key==='ArrowLeft') loadStep(currentStep-1);
    });

    window.addEventListener('resize', ()=>{
      if(steps[currentStep].objects) loadStep(currentStep);
    });

    loadStep(0);
  </script>
</body>
</html>
