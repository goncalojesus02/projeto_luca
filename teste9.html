<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página Interativa</title>
<style>
  body {
    margin: 0;
    background-color: white;
    height: 100vh;
    overflow: hidden;
    position: relative;
    font-family: Arial, sans-serif;
  }

  /* Parágrafo no canto superior direito */
  #top-right {
    position: absolute;
    top: 1em;
    right: 1em;
    cursor: pointer;
  }

  /* Imagem central e arrastável */
  #draggable {
    height: 30%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    cursor: grab;
    user-select: none;
  }

  #draggable.dragging {
    cursor: grabbing;
  }
</style>
</head>
<body>

<p id="top-right">Gardener</p>

<img id="draggable" src="/imgs/envelope_frete.png" alt="Objeto" />

<script>
  // Parágrafo clicável
  const topRight = document.getElementById('top-right');

  topRight.addEventListener('click', () => {
    window.location.href = '/gardener.html';
  });

  // Imagem arrastável
  const draggable = document.getElementById('draggable');
  let offsetX = 0;
  let offsetY = 0;
  let isDragging = false;
  let dragMoved = false; // Detecta se houve movimento

  draggable.addEventListener('mousedown', (e) => {
    isDragging = true;
    dragMoved = false;
    draggable.classList.add('dragging');
    offsetX = e.clientX - draggable.offsetLeft;
    offsetY = e.clientY - draggable.offsetTop;
    e.preventDefault(); 
  });

  document.addEventListener('mousemove', (e) => {
    if (isDragging) {
      let x = e.clientX - offsetX;
      let y = e.clientY - offsetY;

      // Detecta que o mouse realmente se moveu
      dragMoved = true;

      // Limitar à viewport
      const maxX = window.innerWidth - draggable.offsetWidth;
      const maxY = window.innerHeight - draggable.offsetHeight;
      x = Math.max(0, Math.min(x, maxX));
      y = Math.max(0, Math.min(y, maxY));

      draggable.style.left = x + 'px';
      draggable.style.top = y + 'px';
      draggable.style.transform = 'none';
    }
  });

  document.addEventListener('mouseup', () => {
    if (isDragging) {
      isDragging = false;
      draggable.classList.remove('dragging');
    }
  });

  // Clique na imagem para redirecionar apenas se não houve movimento
  draggable.addEventListener('click', () => {
    if (!dragMoved) {
      window.location.href = '/camin1.html';
    }
  });
</script>

</body>
</html>
