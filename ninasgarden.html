  <meta charset="utf-8">
  <title>nina's garden - act 1</title>
  <style>
   html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  
}

#stage {
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  scroll-behavior: smooth;
}

.image-wrap {
  position: relative;
  display: inline-block;
  height: 100vh;
}

#stageImg {
  display: block;
  user-select: none;
  -webkit-user-drag: none;
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* ----------------------------- */
/* OBJETOS INTERATIVOS (HOTSPOTS) */
/* ----------------------------- */
.hotspot-object {
  position: absolute;
  cursor: pointer;
  pointer-events: auto;
  z-index: 2;
  filter: drop-shadow(4px 6px 8px rgba(0, 0, 0, 0.65));
  height: auto;
}

.hotspot-flip-container {
  position: relative;
  width: 100%;
  height: 100%;
  text-align: center;
  transform-style: initial;
}

.hotspot-object:hover .hotspot-flip-container {
  transform: none;
}

.hotspot-object-face {
  position: absolute;
  width: 100%;
  height: 100%;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  display: block;
}

.hotspot-object-front {
  z-index: 2;
  height: auto;
  width: 100%;
}

.hotspot-object-back {
  display: none;
  height: auto;
  width: 100%;
}

/* ----------------------------- */
/* FULLSCREEN PADRÃO             */
/* ----------------------------- */
.fullscreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  box-shadow: 0 0 1px rgba(0, 0, 0, 0.5);
}

.fullscreen img {
  max-width: 85vw;
  max-height: 85vh;
  object-fit: contain;
  filter: drop-shadow(4px 6px 8px rgba(0, 0, 0, 0.4));
  cursor: pointer;
  transition: none !important; /* Sem zoom ou hover */
}

.fullscreen img:hover {
  transform: none !important; /* Desativa efeitos ao passar o rato */
}

/* ----------------------------- */
/* EFEITO FLIP (FULLSCREEN)      */
/* ----------------------------- */
.fullscreen-flip-host {
  display: flex;
  align-items: center;
  justify-content: center;
  max-width: 90vw;
  max-height: 90vh;
  width: 100%;
  height: 100%;
  perspective: 1200px;
  cursor: pointer;
}

.fullscreen-flip-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-style: preserve-3d;
  transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
  will-change: transform !important
}

.fullscreen-face {
  position: absolute;
  max-width: 85vw;
  max-height: 85vh;
  object-fit: contain;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  filter: drop-shadow(4px 6px 8px rgba(0, 0, 0, 0.4));
  cursor: pointer;
  transition: none !important;
  filter: none !important;
   z-index: 2;
}

.fullscreen-back {
  transform: rotateY(180deg) translateZ(-1px);
    z-index: 1;
}




/* ----------------------------- */
/* FULLSCREEN BOOK3 (FUNDO ESPECIAL) */
/* ----------------------------- */
.fullscreen-book3 {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-image: url('/imgs/secao8/Tecido-+-livro_aberto.png');
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
}

.fullscreen-book3 img {
  max-width: 80%;
  max-height: 80%;

  cursor: pointer;
  border-radius: 6px;
  animation: zoomIn 0.4s ease;
}

@keyframes zoomIn {
  from {
    transform: scale(0.5);
    opacity: 0;
  }

  to {
    transform: scale(1);
    opacity: 1;
  }
}

/* Remove barras de rolagem internas */
.fullscreen section::-webkit-scrollbar {
  display: none;
}

.fullscreen > section {
  max-height: 85vh;
  display: flex;
  overflow-x: auto;
  overflow-y: hidden;
}



/* PISQUE DOS CARTOES */
/* força composição por GPU e esconde a “verso” em flips 3D */
.card, .card, .carousel-item * {
  backface-visibility: hidden !important;
  -webkit-backface-visibility: hidden !important;
  transform-style: preserve-3d !important;
    will-change: transform, opacity;
  transform: translateZ(0); /* força GPU composition */
  contain: layout paint; /* isola o layout, evita reflow global */
}

/* promove o layer — evita repinturas quebradas */
.card, .carousel-item {
  will-change: transform, opacity;
  transform: translateZ(0); /* ou translate3d(0,0,0) */
}

/* se houver transições que piscam, isola-as numa classe separada */

.inner-wrapper {
  transform-style: preserve-3d;
  transition: transform 0.6s;
  backface-visibility: hidden; /* MUITO importante */
  will-change: transform;
  transform: rotateY(0deg) translateZ(0);
}

.card.no-transition,
.card.no-transition * {
  transition: none !important;
}

  </style>

// adiciona a classe no-transition por 300ms enquanto o layout estabiliza.
function temporarilyDisableTransitions(root = document.body, ms = 350) {
  root.classList.add('no-transition');
  clearTimeout(root._noTransTO);
  root._noTransTO = setTimeout(() => root.classList.remove('no-transition'), ms);
}

// --- Criar hotspots ---
function createObjects(objects) {
  clearOverlay();
  objects.forEach(o => {
    const container = document.createElement('section');
    container.className = 'hotspot-object';
    container.style.left = o.left + '%';
    container.style.top = o.top + '%';
    if (o.width) container.style.width = o.width + '%';
    container.style.height = o.height ? o.height + '%' : 'auto';
    container.style.zIndex = o.zindex ?? 2;
    if (o.rotate) container.style.transform = `rotate(${o.rotate}deg)`;

    const flipContainer = document.createElement('section');
    flipContainer.className = 'hotspot-flip-container';

    const frontFace = document.createElement('img');
    frontFace.src = o.src;
    frontFace.className = 'hotspot-object-face hotspot-object-front';
    flipContainer.appendChild(frontFace);

    if (o.backSrc) {
      const backFace = document.createElement('img');
      backFace.src = o.backSrc;
      backFace.className = 'hotspot-object-face hotspot-object-back';
      flipContainer.appendChild(backFace);

      // Clique no hotspot abre fullscreen com flip
      container.addEventListener('click', e => {
        e.stopPropagation();
        openFullscreenWithFlip(o.src, o.backSrc, o.nextStep);
      });
    } 

    
    
    else {
      container.addEventListener('click', e => {
        e.stopPropagation();
        openZoom(o.src, o.nextStep); // <-- chama openZoom para book1 e normal zoom
      });

      
    }

    container.appendChild(flipContainer);
    overlay.appendChild(container);
  });
}

  img.src = src;
  fullscreen.appendChild(img);

  img.addEventListener('click', e => {
    e.stopPropagation();
    if (nextStep) loadStep(nextStep);
    fullscreen.remove();
  });

  fullscreen.addEventListener('click', e => {
    if (e.target === fullscreen) {
      fullscreen.remove();
      if (nextStep) loadStep(nextStep);
    }
  });

  document.body.appendChild(fullscreen);
}

// --- Fullscreen com flip para objetos com backSrc ---
function openFullscreenWithFlip(frontSrc, backSrc, nextStep) {
  const fullscreen = document.createElement('section');
  fullscreen.className = 'fullscreen';

  const flipHost = document.createElement('section');
  flipHost.className = 'fullscreen-flip-host';

  const flipWrapper = document.createElement('section');
  flipWrapper.className = 'fullscreen-flip-wrapper';

  const frontFace = document.createElement('img');
  frontFace.src = frontSrc;
  frontFace.className = 'fullscreen-face fullscreen-front';

  const backFace = document.createElement('img');
  backFace.src = backSrc;
  backFace.className = 'fullscreen-face fullscreen-back';

  flipWrapper.appendChild(frontFace);
  flipWrapper.appendChild(backFace);
  flipHost.appendChild(flipWrapper);
  fullscreen.appendChild(flipHost);

  // Clique na imagem faz flip
  flipWrapper.addEventListener('click', e => {
    e.stopPropagation();
    const flipped = flipWrapper.style.transform === 'rotateY(180deg)';
    flipWrapper.style.transform = flipped ? 'rotateY(0deg)' : 'rotateY(180deg)';
  });

  fullscreen.addEventListener('click', e => {
    if (e.target === fullscreen) {
      fullscreen.remove();
      if (nextStep) loadStep(nextStep);
    }
  });

  document.body.appendChild(fullscreen);
}

// --- Carregar passo ---
function loadStep(i) {
  if (i < 0 || i >= steps.length) return;
  currentStep = i;
  const step = steps[i];
  clearOverlay();
  img.src = step.src;
  preload(steps[i + 1]?.src);

  img.onload = () => {
    if (i === 0) {
      wrap.style.width = "100vw";
      wrap.style.height = "100vh";
      img.style.width = "100vw";
      img.style.height = "100vh";
      img.style.objectFit = "contain";
    } else if (i === 1) {
      wrap.style.width = "100vw";
      wrap.style.height = "100vh";
      img.style.width = "100vw";
      img.style.height = "100vh";
      img.style.objectFit = "cover";
    } else {
      wrap.style.height = "100vh";
      wrap.style.width = img.naturalWidth * (wrap.clientHeight / img.naturalHeight) + 'px';
      img.style.height = "100vh";
      img.style.width = "auto";
      img.style.objectFit = "initial";
    }

    createObjects(step.objects || []);
    img.onclick = (i === 0) ? () => loadStep(step.next) : null;

    const stage = document.getElementById('stage');
    stage.scrollLeft = wrap.scrollWidth - stage.clientWidth;
  };
}

loadStep(currentStep);


    
  </script>
