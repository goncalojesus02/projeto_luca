<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <title>luca project</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    #stage {
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      scroll-behavior: smooth;
    }
    .image-wrap {
      position: relative;
      display: inline-block;
      height: 100vh;
    }
    #stageImg {
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .hotspot-object {
      position: absolute;
      cursor: pointer;
      pointer-events: auto;
      z-index: 2;
      filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.65));
      height: auto;
    }
    .fullscreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #ffffff; /* fundo branco sólido */
    display: flex;
    box-shadow: 0px 0px 1px rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

    .fullscreen img {
    max-width: 90vw;
    max-height: 90vh;
    filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.4));
    animation: zoomIn 0.4s ease;
    cursor: pointer;
  }

     /* Novo fullscreen só para o Book3 (secção 8) */
  .fullscreen-book3 {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-image: url('/imgs/secao8/Tecido-+-livro_aberto.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
  }

  .fullscreen-book3 img {
    max-width: 80%;
    max-height: 80%;
    box-shadow: 0px 0px 1px rgba(0,0,0,0.5);
    cursor: pointer;
    border-radius: 6px;
    animation: zoomIn 0.4s ease;
  }
    @keyframes zoomIn {
      from {transform: scale(0.5); opacity: 0;}
      to {transform: scale(1); opacity: 1;}
    }
    /* esconder scroll do carrossel horizontal */
    .fullscreen div::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

    function preload(src) { if(src){ new Image().src = src; } }
    function clearOverlay() { overlay.innerHTML = ''; }

    function createObjects(objects){
      clearOverlay();
      objects.forEach(o=>{
        const obj = document.createElement('img');
        obj.src = o.src;
        obj.className = 'hotspot-object';
        obj.style.left = o.left + '%';
        obj.style.top = o.top + '%';
        if(o.width!==undefined) obj.style.width = o.width + '%';
        obj.style.height = o.height ? o.height + '%' : 'auto';
        obj.style.zIndex = o.zindex !== undefined ? o.zindex : 2;

        if(o.rotate !== undefined){
          obj.style.transform = `rotate(${o.rotate}deg)`;
        }

        obj.addEventListener('click', e=>{
          e.stopPropagation();
          openZoom(o.src, o.nextStep);
        });
        overlay.appendChild(obj);
      });
    }

    function loadStep(i){
      if(i < 0 || i >= steps.length) return;
      currentStep = i;
      const step = steps[i];
      clearOverlay();
      img.src = step.src;
      preload(steps[i+1]?.src);

      img.onload = () => {
        if(i === 0){ 
          wrap.style.width = "100vw";
          wrap.style.height = "100vh";
          img.style.width = "100vw";
          img.style.height = "100vh";
          img.style.objectFit = "contain";
        } else if(i === 1){
          wrap.style.width = "100vw";
          wrap.style.height = "100vh";
          img.style.width = "100vw";
          img.style.height = "100vh";
          img.style.objectFit = "cover";
        } else {
          wrap.style.height = "100vh";
          wrap.style.width = img.naturalWidth * (wrap.clientHeight / img.naturalHeight) + 'px';
          img.style.height = "100vh";
          img.style.width = "auto";
          img.style.objectFit = "initial";
        }

        createObjects(step.objects || []);
        img.onclick = (i === 0) ? () => loadStep(step.next) : null;

        const stage = document.getElementById('stage');
        stage.scrollLeft = wrap.scrollWidth - stage.clientWidth;
      };
    }

    function openZoom(src, nextStep){
      // --- Book1 gallery ---
      if (src.includes("/imgs/secao3/book1/1_capa.png")) {
        let currentIndex = 0;
        const fullscreen = document.createElement('div');
        fullscreen.className = 'fullscreen';
        const zimg = document.createElement('img');
        zimg.src = book1Gallery[currentIndex];
        fullscreen.appendChild(zimg);
        document.body.appendChild(fullscreen);

        const nextImage = () => {
          if (currentIndex < book1Gallery.length - 1) {
            currentIndex++;
            zimg.src = book1Gallery[currentIndex];
          } else {
            fullscreen.remove();
            loadStep(4);
          }
        };

        zimg.addEventListener('click', e => { e.stopPropagation(); nextImage(); });
        fullscreen.addEventListener('click', e => { if (e.target === fullscreen) nextImage(); });
      }
      // --- Book2 gallery ---
      else if (src.includes("/imgs/secao5/book2/2_capa.png")) {
        let currentIndex = 0;
        const fullscreen = document.createElement('div');
        fullscreen.className = 'fullscreen';
        const zimg = document.createElement('img');
        zimg.src = book2Gallery[currentIndex];
        fullscreen.appendChild(zimg);
        document.body.appendChild(fullscreen);

        const nextImage = () => {
          if (currentIndex < book2Gallery.length - 1) {
            currentIndex++;
            zimg.src = book2Gallery[currentIndex];
          } else {
            fullscreen.remove();
            loadStep(6);
          }

        zimg.addEventListener('click', e => { e.stopPropagation(); nextImage(); });
        fullscreen.addEventListener('click', e => { if (e.target === fullscreen) nextImage(); });

      // --- Book4 gallery ---
      else if (src.includes("/imgs/secao9/book4/4_capa.png")) {

        const zimg = document.createElement('img');
        zimg.src = book4Gallery[currentIndex];
        fullscreen.appendChild(zimg);
        document.body.appendChild(fullscreen);

        const nextImage = () => {
          if (currentIndex < book4Gallery.length - 1) {
            currentIndex++;
            zimg.src = book4Gallery[currentIndex];
          } else {
            fullscreen.remove();
            loadStep(10); // ajusta para o próximo step após terminar o Book4
          }
        };

        zimg.addEventListener('click', e => { e.stopPropagation(); nextImage(); });
        fullscreen.addEventListener('click', e => { if (e.target === fullscreen) nextImage(); });
      }


          // --- Book5 gallery ---
    else if (src.includes("/imgs/secao10/book5/5_capa.png")) {
      let currentIndex = 0;

      fullscreen.appendChild(zimg);
      document.body.appendChild(fullscreen);

      const nextImage = () => {

          currentIndex++;
          zimg.src = book5Gallery[currentIndex];
        } else {
          fullscreen.remove();
          loadStep(11); // avança para o step 11 ao terminar
        }
      };

      zimg.addEventListener('click', e => { e.stopPropagation(); nextImage(); });
      fullscreen.addEventListener('click', e => { if (e.target === fullscreen) nextImage(); });
    }


        // --- Book6 gallery ---
    else if (src.includes("/imgs/secao11/book6/6_capa.png")) {

    // --- Book3 gallery para seção 8 ---
    else if (src.includes("tecido_booklet_fechado.png")) {

      // --- Normal zoom ---
      else {

        fullscreen.className = 'fullscreen';

        zimg.src = src;
        fullscreen.appendChild(zimg);
        fullscreen.addEventListener('click', e => {
          if (e.target === fullscreen) {
            fullscreen.remove();
            if(src.includes("Cianotipo_SINGLE_2.png")) loadStep(8);
            else if(nextStep !== undefined) loadStep(nextStep);
          }
        });
        document.body.appendChild(fullscreen);
      }
    }

    document.addEventListener('keydown', e=>{
      if(e.key === 'ArrowRight') loadStep(currentStep + 1);
      if(e.key === 'ArrowLeft') loadStep(currentStep - 1);
    });

    window.addEventListener('resize', ()=>{ if(steps[currentStep].objects) loadStep(currentStep); });
